<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · RAL Technologies</title>
    <!-- This file existing at the publish root switches Cloudflare Pages out of
         SPA fallback mode: missing paths (crucially missing /assets/* files)
         now return a real 404 instead of index.html with a 200 — which the
         immutable /assets/* cache header used to make permanently cacheable. -->
    <style>
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #0c0715; color: #f8f8f8;
        font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 24px;
      }
      h1 { font-size: 56px; margin: 0; background: linear-gradient(135deg, #d6c2ff, #a78bfa 45%, #7c5aff);
           -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { color: #d1c4e9; margin: 0; }
      a { color: #a78bfa; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>That page does not exist.</p>
    <a href="/">Back to raltech.dev</a>
  </body>
</html>
