[build]
  command = "npm run build"
  publish = "dist"

# A MISSING file under /assets must 404, never fall through to the SPA rewrite:
# the immutable /assets/* cache header below would make that HTML fallback
# permanently cacheable at the edge/browser for the asset URL (this bit us with
# the Letterlock logo). Real files still win — rewrites never shadow files.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed filenames, so hashed assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts are also fingerprinted — cache them hard too.
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always revalidate so deploys go live immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
