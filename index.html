<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0715" />
    <title>RAL Technologies</title>

    <!-- Speed up the WhatsApp deep-link click + DNS resolution. wa.me is the
         primary contact CTA; pre-warming the connection knocks ~150–300ms off
         the first tap on mobile. -->
    <link rel="preconnect" href="https://wa.me" crossorigin />
    <link rel="dns-prefetch" href="https://wa.me" />
    <meta
      name="description"
      content="RAL Technologies builds custom software and AI automations that scale revenue for GCC founders, SMBs, and enterprises. Bahrain-based, founder-led."
    />
    <link rel="canonical" href="https://raltech.dev/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RAL Technologies" />
    <meta property="og:title" content="RAL Technologies" />
    <meta
      property="og:description"
      content="Custom software and AI automations that scale revenue. Bahrain-based, founder-led, built for GCC founders and enterprises alike."
    />
    <meta property="og:url" content="https://raltech.dev/" />
    <meta property="og:image" content="https://raltech.dev/apple-touch-icon.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAL Technologies" />
    <meta
      name="twitter:description"
      content="Custom software and AI automations that scale revenue. Bahrain-based, founder-led."
    />
    <meta name="twitter:image" content="https://raltech.dev/apple-touch-icon.png" />

    <!-- Inter is self-hosted via @fontsource (imported in main.tsx) — no
         Google Fonts round-trip. -->

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RAL Technologies",
        "alternateName": "Revenue Automation Lab",
        "url": "https://raltech.dev/",
        "logo": "https://raltech.dev/apple-touch-icon.png",
        "email": "info@raltech.dev",
        "telephone": "+973-6638-6602",
        "description": "RAL Technologies builds custom software and AI automations that scale revenue for GCC founders, SMBs, and enterprises.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "BH"
        },
        "sameAs": [
          "https://instagram.com/raltechh",
          "https://www.tiktok.com/@raltechh",
          "https://www.linkedin.com/company/raltechh/"
        ]
      }
    </script>

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RAL Technologies",
        "url": "https://raltech.dev/"
      }
    </script>
    <!-- ─── Intro preloader (Lusion-tier) ─────────────────────────────────
         Paints on the FIRST frame (inline HTML + critical CSS) before any
         Vite chunk loads. The wordmark stroke-draws via CSS, the percentage
         counter and final exit are driven by React (src/components/Preloader.tsx)
         once fonts + window.load + the hero WebGL "ready" event resolve.
         Total budget: ≤1.8s on a typical session, with a 4.5s safety dismissal
         so a stalled signal never traps the user. ──────────────────────── -->
    <style>
      html, body { background: #0c0715; }
      body { margin: 0; }
      #ral-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            ellipse at 50% 32%,
            rgba(124, 90, 255, 0.20) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 50% 92%,
            rgba(180, 80, 255, 0.16) 0%,
            transparent 60%
          ),
          #0c0715;
        color: #f8f8f8;
        overflow: hidden;
        isolation: isolate;
        /* the entire overlay clips up to nothing on reveal (GPU-cheap). */
        clip-path: inset(0 0 0 0);
        will-change: clip-path;
        /* the whole screen is the "begin" target once ready */
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Inter, system-ui, sans-serif;
      }
      #ral-preloader[data-state="leaving"] { pointer-events: none; cursor: default; }
      #ral-preloader.is-removed { display: none; }

      /* Aurora atmosphere behind the wordmark — decorative drift. */
      .ralpl-aurora {
        position: absolute;
        inset: -20%;
        z-index: -1;
        background:
          radial-gradient(60% 50% at 30% 40%, rgba(167, 139, 250, 0.20), transparent 70%),
          radial-gradient(50% 40% at 70% 60%, rgba(74, 245, 192, 0.08), transparent 75%);
        filter: blur(50px);
        pointer-events: none;
        opacity: 0;
        animation:
          ralpl-aurora-in 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards,
          ralpl-drift 9s ease-in-out 0.6s infinite alternate;
      }
      @keyframes ralpl-aurora-in { to { opacity: 1; } }
      @keyframes ralpl-drift {
        0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
        100% { transform: translate3d( 2%,  1%, 0) scale(1.05); }
      }

      .ralpl-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
      }

      /* The wordmark IS the glass: a faint outline that fills with liquid. */
      .ralpl-mark {
        width: clamp(210px, 44vw, 380px);
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 0 34px rgba(167, 139, 250, 0.22));
      }
      .ralpl-glyph {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", Inter, system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      /* empty-glass outline — stroke-draws on load */
      .ralpl-outline {
        fill: rgba(167, 139, 250, 0.05);
        stroke: url(#ralpl-grad);
        stroke-width: 0.9;
        stroke-linejoin: round;
        paint-order: stroke;
        stroke-dasharray: 640;
        stroke-dashoffset: 640;
        animation: ralpl-draw 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      @keyframes ralpl-draw { to { stroke-dashoffset: 0; } }
      /* the liquid (path `d` is driven per-frame by Preloader.tsx) */
      .ralpl-liquid-shine { opacity: 0.55; }

      /* "tap to begin" gate — hidden until the page signals ready. */
      .ralpl-gate {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(209, 196, 233, 0.85);
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
      }
      #ral-preloader[data-ready="1"] .ralpl-gate {
        animation: ralpl-rise 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards;
      }
      @keyframes ralpl-rise { to { opacity: 1; transform: translateY(0); } }
      .ralpl-gate-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4af5c0;
        box-shadow: 0 0 12px #4af5c0;
        animation: ralpl-dot 1.6s ease-in-out infinite;
      }
      @keyframes ralpl-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(0.65); }
      }
      /* once playing / leaving, retire the gate prompt */
      #ral-preloader[data-state="playing"] .ralpl-gate,
      #ral-preloader[data-state="leaving"] .ralpl-gate {
        opacity: 0 !important;
        animation: none;
        transition: opacity 0.3s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .ralpl-outline { animation: none; stroke-dashoffset: 0; }
        .ralpl-aurora, .ralpl-gate { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="ral-preloader" data-state="loading" aria-hidden="true" role="presentation">
      <div class="ralpl-aurora"></div>
      <div class="ralpl-stage">
        <svg class="ralpl-mark" viewBox="0 0 320 104" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="ralpl-grad" x1="0" y1="1" x2="0.8" y2="0">
              <stop offset="0%" stop-color="#7c5aff" />
              <stop offset="55%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#d6c2ff" />
            </linearGradient>
            <clipPath id="ralpl-clip">
              <text class="ralpl-glyph" x="160" y="74" text-anchor="middle" font-size="86">RAL</text>
            </clipPath>
          </defs>
          <!-- empty glass: the wordmark outline -->
          <text class="ralpl-glyph ralpl-outline" x="160" y="74" text-anchor="middle" font-size="86">RAL</text>
          <!-- liquid, clipped to the letters; Preloader.tsx drives the path `d` -->
          <g clip-path="url(#ralpl-clip)">
            <path class="ralpl-liquid" d="M0 104 L320 104 L320 104 L0 104 Z" fill="url(#ralpl-grad)"></path>
            <path class="ralpl-liquid-shine" d="" fill="rgba(255,255,255,0.4)"></path>
          </g>
        </svg>
        <div class="ralpl-gate">
          <span class="ralpl-gate-dot" aria-hidden="true"></span>
          <span class="ralpl-gate-text">tap to begin</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
